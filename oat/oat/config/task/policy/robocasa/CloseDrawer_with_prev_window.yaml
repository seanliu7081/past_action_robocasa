# CloseDrawer_with_prev_window.yaml  (RoboCasa single task)
# ──────────────────────────────────────────────────────────────
# Identical to CloseDrawer_with_past.yaml except for the dataset class: this
# one also emits the PREVIOUS rollout window (prev_obs, prev_past_action),
# which OATPolicyWithSelfPast needs to regenerate its own past_action during
# training. Everything else is unchanged.
#
# To make a prev_window variant of any other RoboCasa task, copy that task's
# *_with_past.yaml and change the dataset `_target_` to
# ZarrDatasetWithPrevWindow plus add `n_exec_steps: ${n_action_steps}`.

name: CloseDrawer

task_name: CloseDrawer
lazy_eval: false

shape_meta: &shape_meta
  obs:
    robot0_agentview_left_image:
      shape: [128, 128, 3]
      type: rgb
    robot0_agentview_right_image:
      shape: [128, 128, 3]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [128, 128, 3]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      type: state
    robot0_eef_quat:
      shape: [4]
      type: state
    robot0_gripper_qpos:
      shape: [2]
      type: state
    robot0_base_pos:
      shape: [3]
      type: state
    robot0_base_quat:
      shape: [4]
      type: state
  action:
    shape: [12]


env_runner:
  _target_: oat.env_runner.robocasa_runner.RoboCasaRunner
  env_name: CloseDrawer
  robots: PandaOmron
  n_test: 50
  n_test_vis: 5
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 20
  n_parallel_envs: 10
  image_size: 128
  camera_names:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand
  state_ports:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_base_pos
    - robot0_base_quat
  max_episode_steps: 500


dataset:
  # Same obs / action / past_action as CloseDrawer_with_past.yaml, plus the
  # PREVIOUS rollout window (prev_obs, prev_past_action).
  _target_: oat.dataset.zarr_dataset_with_prev_window.ZarrDatasetWithPrevWindow
  zarr_path: data/robocasa/CloseDrawer_N${training.num_demo}.zarr
  obs_keys:
    - robot0_agentview_left_image
    - robot0_agentview_right_image
    - robot0_eye_in_hand_image
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_base_pos
    - robot0_base_quat
  action_key: action
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${horizon}
  seed: ${seed}
  val_ratio: 0.1
  past_n: ${past_n}
  # Actions actually executed per chunk at rollout, i.e. the policy's
  # n_action_steps (8) — NOT the chunk length above (horizon, 16).
  n_exec_steps: ${n_action_steps}
