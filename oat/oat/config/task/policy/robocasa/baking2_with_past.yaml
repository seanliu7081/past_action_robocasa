# baking2_with_past.yaml  (RoboCasa multi-task: baking)
# ──────────────────────────────────────────────────────────────
# Multi-task variant over the 2 baking tasks (CupcakeCleanup, PastryDisplay),
# modelled on doors4_with_past.yaml. Trains one OATPolicy across both tasks,
# conditioning on `task_uid` (a type:state observation).
#
# Launch (num_demo=204 = 101 + 103 so the zarr path resolves to
# data/robocasa/baking2_N204.zarr):
#   accelerate launch scripts/run_workspace.py \
#     --config-name train_oatpolicy_with_enriched_past_robocasa \
#     task/policy=robocasa/baking2_with_past \
#     training.num_demo=204 \
#     policy.action_tokenizer.checkpoint=<path_to_tokenizer_ckpt>
#
# Build the dataset first with:
#   python scripts/compose_robocasa_multitask_dataset.py -mt baking2 --shuffle
#
# DATA PROVENANCE -- read before comparing against the other suites.
# These two tasks have no RoboCasa v0.2 release. The demos come from the
# RoboCasa **v1.0** drop (LeRobot format) and are converted by
# scripts/convert_robocasa_lerobot_to_zarr.py, which (a) permutes the v1.0
# action ordering into v0.2's and (b) converts the base-relative eef pose to
# world frame so it matches what RoboCasaEnv emits at eval. Consequences:
#   * 204 demos total (101 + 103), vs 200 *per task* in the v0.2 suites -- so
#     roughly half the data per task of e.g. doors4.
#   * The demos are all human teleop, and 204 is ALL THAT EXISTS. The
#     "50 human + 150 MimicGen = 200/task" convention in robocasa_training.md
#     is unreachable here: v1.0 ships MimicGen only for `pretrain/atomic/`
#     tasks (60 of 410 datasets). Both of these are `pretrain/composite/`,
#     and no composite task has any MimicGen data. Raising num_demo above 204
#     will simply fail to resolve the zarr path.
#
# `lazy_eval: true` matches the other multi-task suites (robocasa3/sink3/doors4):
# no rollouts during training, validation loss only. Enable rollouts with the CLI
# override `task.policy.lazy_eval=false` (it only works as a CLI override -- see
# robocasa_implementation.md section 6).
#
# ROLLOUT EVAL REQUIRES mujoco==3.2.6. Both envs build and render there
# (verified). Under mujoco 3.3.x the CupcakeCleanup env fails to build on every
# seed with "mesh volume is too small ... Try setting inertia to shell" -- a
# strictness check that rejects RoboCasa v0.2 fixture meshes. It is
# layout-dependent, so it presents as intermittent and task-specific when it is
# really a mujoco version problem.
#
# `max_episode_steps: 1050` comes from the v1.0 registry horizon for both tasks.

name: baking2

task_name: baking2
lazy_eval: true

shape_meta: &shape_meta
  obs:
    robot0_agentview_left_image:
      shape: [128, 128, 3]
      type: rgb
    robot0_agentview_right_image:
      shape: [128, 128, 3]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [128, 128, 3]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      type: state
    robot0_eef_quat:
      shape: [4]
      type: state
    robot0_gripper_qpos:
      shape: [2]
      type: state
    robot0_base_pos:
      shape: [3]
      type: state
    robot0_base_quat:
      shape: [4]
      type: state
    task_uid:
      shape: [1]
      type: state
  action:
    shape: [12]


env_runner:
  _target_: oat.env_runner.robocasa_multitask_runner.RoboCasaMultiTaskRunner
  task_name: baking2
  robots: PandaOmron
  n_test: 100
  n_test_vis: 4
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 20
  # Kept a multiple of the 2 subtasks so each task keeps its env slot across
  # chunks, and well under the EGL framebuffer ceiling on a 2x4090 box.
  n_parallel_envs: 10
  image_size: 128
  camera_names:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand
  state_ports:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_base_pos
    - robot0_base_quat
  max_episode_steps: 1050


dataset:
  _target_: oat.dataset.zarr_dataset_with_past.ZarrDatasetWithPastAction
  zarr_path: data/robocasa/baking2_N${training.num_demo}.zarr
  obs_keys:
    - robot0_agentview_left_image
    - robot0_agentview_right_image
    - robot0_eye_in_hand_image
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_base_pos
    - robot0_base_quat
    - task_uid
  action_key: action
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${horizon}
  seed: ${seed}
  val_ratio: 0.1
  past_n: ${past_n}
