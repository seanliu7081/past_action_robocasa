# sink3_with_prev_window.yaml  (RoboCasa multi-task: sink manipulation)
# ──────────────────────────────────────────────────────────────
# Identical to sink3_with_past.yaml except for the dataset class: this one
# also emits the PREVIOUS rollout window (prev_obs, prev_past_action), which
# OATPolicyWithSelfPast needs to regenerate its own past_action during
# training. Everything else — shape_meta, env_runner, obs_keys — is unchanged,
# so a policy trained with either task group sees the same observations and is
# directly comparable to the sink3_with_past enriched-past baseline.
#
# Launch (note num_demo=600 = 3 tasks x 200 demos so the zarr path resolves to
# data/robocasa/sink3_N600.zarr):
#   python -m oat.workspace.train_policy \
#     --config-name train_oatpolicy_with_self_past_robocasa \
#     task/policy=robocasa/sink3_with_prev_window \
#     training.num_demo=600 \
#     policy.action_tokenizer.checkpoint=<path_to_tokenizer_ckpt>
#
# Build the dataset first with:
#   python scripts/compose_robocasa_multitask_dataset.py -mt sink3 --shuffle

name: sink3

task_name: sink3
lazy_eval: true

shape_meta: &shape_meta
  obs:
    robot0_agentview_left_image:
      shape: [128, 128, 3]
      type: rgb
    robot0_agentview_right_image:
      shape: [128, 128, 3]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [128, 128, 3]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      type: state
    robot0_eef_quat:
      shape: [4]
      type: state
    robot0_gripper_qpos:
      shape: [2]
      type: state
    robot0_base_pos:
      shape: [3]
      type: state
    robot0_base_quat:
      shape: [4]
      type: state
    task_uid:
      shape: [1]
      type: state
  action:
    shape: [12]


env_runner:
  _target_: oat.env_runner.robocasa_multitask_runner.RoboCasaMultiTaskRunner
  task_name: sink3
  robots: PandaOmron
  n_test: 150
  n_test_vis: 9
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 20
  # Kept a multiple of the 3 subtasks so each task keeps its env slot across
  # chunks, and well under the EGL framebuffer ceiling on a 2x4090 box.
  n_parallel_envs: 15
  image_size: 128
  camera_names:
    - robot0_agentview_left
    - robot0_agentview_right
    - robot0_eye_in_hand
  state_ports:
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_base_pos
    - robot0_base_quat
  max_episode_steps: 500


dataset:
  # Same obs / action / past_action as sink3_with_past.yaml, plus the
  # PREVIOUS rollout window (prev_obs, prev_past_action).
  _target_: oat.dataset.zarr_dataset_with_prev_window.ZarrDatasetWithPrevWindow
  zarr_path: data/robocasa/sink3_N${training.num_demo}.zarr
  obs_keys:
    - robot0_agentview_left_image
    - robot0_agentview_right_image
    - robot0_eye_in_hand_image
    - robot0_eef_pos
    - robot0_eef_quat
    - robot0_gripper_qpos
    - robot0_base_pos
    - robot0_base_quat
    - task_uid
  action_key: action
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${horizon}
  seed: ${seed}
  val_ratio: 0.1
  past_n: ${past_n}
  # Actions actually executed per chunk at rollout, i.e. the policy's
  # n_action_steps (8) — NOT the chunk length above (horizon, 16).
  n_exec_steps: ${n_action_steps}
